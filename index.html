<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Traitors: Castle of Shadows - True Multiplayer</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0d0705;
      --card-bg: rgba(24, 14, 11, 0.98);
      --gold: #d4af37;
      --gold-bright: #ffd700;
      --crimson: #8b0000;
      --border: #442a1d;
      --text: #eae0d5;
      --text-muted: #a39284;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #25120b 0%, var(--bg) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      background: rgba(12, 6, 4, 0.95);
      border-bottom: 2px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .brand { font-size: 1.2rem; color: var(--gold); font-weight: bold; letter-spacing: 1px; }
    .audio-panel { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
    select, button, input {
      background: #23120d;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 4px;
      font-family: inherit;
    }
    button {
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    button.primary {
      background: #8b0000;
      border-color: #d13636;
      color: #fff;
    }
    button.primary:hover { background: #ab0505; }
    button.gold {
      background: #a37a10;
      border-color: var(--gold);
      color: #fff;
    }
    button.gold:hover { background: #b88b14; }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 26px;
      width: 100%;
      max-width: 660px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.85);
      text-align: center;
    }
    h2 { color: var(--gold); margin-bottom: 12px; font-size: 1.5rem; }
    p { color: var(--text-muted); line-height: 1.5; margin-bottom: 16px; font-size: 0.95rem; }
    .room-code-tag {
      background: #140805;
      padding: 8px 16px;
      border: 1px dashed var(--gold);
      color: var(--gold-bright);
      font-size: 1.3rem;
      letter-spacing: 3px;
      display: inline-block;
      margin: 10px 0;
      border-radius: 4px;
      font-weight: bold;
    }
    .roster { display: flex; flex-direction: column; gap: 8px; margin: 15px 0; }
    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(0,0,0,0.45);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge-traitor { background: var(--crimson); color: #fff; }
    .badge-faithful { background: #065f46; color: #a7f3d0; }
    .badge-bot { background: #374151; color: #9ca3af; }
    .clue-box {
      background: #160a07;
      border: 1px dashed #78350f;
      padding: 14px;
      border-radius: 6px;
      text-align: left;
      margin: 15px 0;
      color: #fed7aa;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .clue-box strong { color: var(--gold); }
    .log-box {
      height: 120px;
      overflow-y: auto;
      background: #000;
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 4px;
      text-align: left;
      font-size: 0.85rem;
      margin: 12px 0;
      font-family: monospace;
    }
    .tab-nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .tab-nav button { flex: 1; padding: 10px; }
    .tab-nav button.active { border-color: var(--gold); background: #3a1e14; color: var(--gold-bright); }
  </style>
</head>
<body>

<header>
  <div class="brand">⚔️ THE TRAITORS: CASTLE OF SHADOWS</div>
  <div class="audio-panel">
    <span>🎵 Bollywood Suspense:</span>
    <select id="bgmSelect" onchange="changeTrack()">
      <option value="0">1. Talaash (Deep Bass Suspense)</option>
      <option value="1">2. Chase Thriller (Fast)</option>
      <option value="2">3. Raat Ka Sannata (Eerie Sitar)</option>
    </select>
    <button id="audioBtn" class="gold" onclick="toggleAudio()">▶ Play Music</button>
  </div>
</header>

<main>
  <div id="gamePanel" class="panel">
    <!-- Screen 1: Real Multiplayer Lobby -->
    <h2>THE GRAND GATHERING</h2>
    <p>Play live across devices. One player hosts the chamber, friends join with the Room Code.</p>
    
    <div style="margin-bottom: 16px;">
      <label style="display:block;margin-bottom:6px;font-size:0.85rem;color:var(--gold);">YOUR PLAYER NAME</label>
      <input type="text" id="nameInput" value="Player" style="width:100%;max-width:280px;text-align:center;">
    </div>

    <div class="tab-nav">
      <button id="tabHostBtn" class="gold active" onclick="switchMode('HOST')">👑 HOST CHAMBER</button>
      <button id="tabJoinBtn" onclick="switchMode('JOIN')">🗝️ JOIN WITH CODE</button>
    </div>

    <!-- Host Section -->
    <div id="hostSection">
      <p style="font-size:0.85rem;">Share this Room Code with your friends:</p>
      <div id="roomCodeDisplay" class="room-code-tag">CREATING...</div>
      
      <div style="margin: 10px 0; font-size: 0.85rem; color: #f59e0b;">
        <span id="playerCount">1</span> Player(s) in Room
      </div>

      <div class="roster" id="rosterList"></div>

      <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 15px;">
        <button class="gold" onclick="addOneBot()">+ Add 1 Bot</button>
        <button class="gold" onclick="fillToFiveBots()">Auto-Fill to 5 Total</button>
      </div>

      <button id="startMultiBtn" class="primary" onclick="hostStartGame()" style="padding:12px 28px;font-size:1.05rem;margin-top:15px;width:100%;max-width:320px;">
        START GAME NOW
      </button>
    </div>

    <!-- Join Section -->
    <div id="joinSection" style="display: none;">
      <p style="font-size:0.85rem;">Enter the 4-digit code provided by your host:</p>
      <input type="text" id="joinCodeInput" placeholder="e.g. 7824" style="width:140px;text-align:center;font-size:1.3rem;letter-spacing
