<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Traitors: Castle of Shadows</title>
  <link rel="icon" href="data:,">
  <!-- Rock-solid MQTT WebSocket Client for true cross-laptop multiplayer -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    :root {
      --bg: #0d0705;
      --card-bg: rgba(24, 14, 11, 0.98);
      --gold: #d4af37;
      --gold-bright: #ffd700;
      --crimson: #8b0000;
      --border: #442a1d;
      --text: #eae0d5;
      --text-muted: #a39284;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #25120b 0%, var(--bg) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      background: rgba(12, 6, 4, 0.95);
      border-bottom: 2px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .brand { font-size: 1.2rem; color: var(--gold); font-weight: bold; letter-spacing: 1px; }
    .audio-panel { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
    select, button, input {
      background: #23120d;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 4px;
      font-family: inherit;
    }
    button { cursor: pointer; font-weight: 600; transition: all 0.2s; }
    button.primary { background: #8b0000; border-color: #d13636; color: #fff; }
    button.primary:hover { background: #ab0505; }
    button.gold { background: #a37a10; border-color: var(--gold); color: #fff; }
    button.gold:hover { background: #b88b14; }
    main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 26px;
      width: 100%;
      max-width: 660px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.85);
      text-align: center;
    }
    h2 { color: var(--gold); margin-bottom: 12px; font-size: 1.5rem; }
    p { color: var(--text-muted); line-height: 1.5; margin-bottom: 16px; font-size: 0.95rem; }
    .room-code-tag {
      background: #140805;
      padding: 8px 16px;
      border: 1px dashed var(--gold);
      color: var(--gold-bright);
      font-size: 1.3rem;
      letter-spacing: 3px;
      display: inline-block;
      margin: 10px 0;
      border-radius: 4px;
      font-weight: bold;
    }
    .roster { display: flex; flex-direction: column; gap: 8px; margin: 15px 0; }
    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(0,0,0,0.45);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
    .badge-traitor { background: var(--crimson); color: #fff; }
    .badge-faithful { background: #065f46; color: #a7f3d0; }
    .badge-bot { background: #374151; color: #9ca3af; }
    .clue-box {
      background: #160a07;
      border: 1px dashed #78350f;
      padding: 14px;
      border-radius: 6px;
      text-align: left;
      margin: 15px 0;
      color: #fed7aa;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .clue-box strong { color: var(--gold); }
    .log-box {
      height: 120px;
      overflow-y: auto;
      background: #000;
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 4px;
      text-align: left;
      font-size: 0.85rem;
      margin: 12px 0;
      font-family: monospace;
    }
    .tab-nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .tab-nav button { flex: 1; padding: 10px; }
    .tab-nav button.active { border-color: var(--gold); background: #3a1e14; color: var(--gold-bright); }
    .status-msg { font-size: 0.9rem; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

<header>
  <div class="brand">⚔️ THE TRAITORS: CASTLE OF SHADOWS</div>
  <div class="audio-panel">
    <span>🎵 Bollywood Suspense:</span>
    <select id="bgmSelect" onchange="changeTrack()">
      <option value="0">1. Talaash (Deep Bass Pulse)</option>
      <option value="1">2. Fast Chase Thriller</option>
      <option value="2">3. Raat Ka Sannata (Drone)</option>
    </select>
    <button id="audioBtn" class="gold" onclick="toggleAudio()">▶ Play Music</button>
  </div>
</header>

<main>
  <div id="gamePanel" class="panel">
    <h2>THE GRAND GATHERING</h2>
    <p>Live multiplayer across any device or Wi-Fi. Host a chamber or enter a code to join.</p>
    
    <div style="margin-bottom: 16px;">
      <label style="display:block;margin-bottom:6px;font-size:0.85rem;color:var(--gold);">YOUR PLAYER NAME</label>
      <input type="text" id="nameInput" value="Nick" style="width:100%;max-width:280px;text-align:center;">
    </div>

    <div class="tab-nav">
      <button id="tabHostBtn" class="gold active" onclick="switchMode('HOST')">👑 HOST CHAMBER</button>
      <button id="tabJoinBtn" onclick="switchMode('JOIN')">🗝️ JOIN WITH CODE</button>
    </div>

    <!-- Host Section -->
    <div id="hostSection">
      <p style="font-size:0.85rem;">Share this Room Code with your friends:</p>
      <div id="roomCodeDisplay" class="room-code-tag">GENERATING...</div>
      
      <div style="margin: 6px 0; font-size: 0.85rem; color: #f59e0b;">
        <span id="playerCount">1</span> Player(s) in Room
      </div>

      <div class="roster" id="rosterList"></div>

      <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 15px;">
        <button class="gold" onclick="addOneBot()">+ Add 1 Bot</button>
        <button class="gold" onclick="fillToFiveBots()">Auto-Fill to 5 Total</button>
      </div>

      <button class="primary" onclick="hostStartGame()" style="padding:12px 28px;font-size:1.05rem;margin-top:15px;width:100%;max-width:320px;">
        START GAME NOW
      </button>
    </div>

    <!-- Join Section -->
    <div id="joinSection" style="display: none;">
      <p style="font-size:0.85rem;">Enter the Room Code from the host:</p>
      <input type="text" id="joinCodeInput" placeholder="e.g. TR46" style="width:140px;text-align:center;font-size:1.3rem;letter-spacing:3px;text-transform:uppercase;">
      <div style="margin-top: 15px;">
        <button class="primary" onclick="joinRoomNow()" style="padding:10px 24px;">Connect to Host 🚪</button>
      </div>
      <p id="joinStatus" class="status-msg" style="color: var(--gold);"></p>
    </div>
  </div>
</main>

<script>
  /* --- AUDIO SYNTHESIZER --- */
  var audioCtx = null;
  var isPlaying = false;
  var bgmInterval = null;

  function toggleAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      isPlaying = !isPlaying;
      document.getElementById('audioBtn').innerText = isPlaying ? "⏸ Pause" : "▶ Play Music";
      if (isPlaying) startSoundLoop();
      else stopSoundLoop();
    } catch(e) { console.log(e); }
  }

  function startSoundLoop() {
    stopSoundLoop();
    var track = parseInt(document.getElementById('bgmSelect').value, 10);
    var speed = (track === 1) ? 220 : 600;
    playNote(track);
    bgmInterval = setInterval(function() {
      if (!audioCtx || !isPlaying) return;
      playNote(track);
    }, speed);
  }

  function stopSoundLoop() {
    if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
  }

  function changeTrack() { if (isPlaying) startSoundLoop(); }

  function playNote(track) {
    if (!audioCtx) return;
    var now = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    var notes = [55, 65.4, 73.4, 82.4, 110];
    if (track === 0) {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(120, now);
      osc.frequency.exponentialRampToValueAtTime(35, now + 0.2);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (track === 1) {
      var f = notes[Math.floor(Math.random() * notes.length)] * 2;
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(f, now);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    } else {
      var f = notes[Math.floor(Math.random() * notes.length)];
      osc.type = 'square';
      osc.frequency.setValueAtTime(f, now);
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      osc.start(now);
      osc.stop(now + 0.8);
    }
  }

  /* --- DYNAMIC MYSTERY GENERATOR --- */
  var MYSTERY_WORDS = ["DAGGER", "POISON", "BETRAY", "VENOM", "SECRET", "SHADOW", "CASTLE", "MURDER"];
  var FORENSIC_CLUES = [
    "Footprint evidence: A boot mark matching size 9 was found near the cellar.",
    "A scrap of black velvet fabric soaked in jasmine perfume was recovered from the window.",
    "The murder weapon: An ornate ivory dagger bearing traces of poison was found.",
    "A burnt paper note reads: 'One of us is silent. Watch the person who spoke least.'"
  ];

  function getDynamicPuzzle() {
    var types = ['CIPHER', 'CLOCK', 'ANAGRAM', 'PRIME'];
    var chosen = types[Math.floor(Math.random() * types.length)];
    var word = MYSTERY_WORDS[Math.floor(Math.random() * MYSTERY_WORDS.length)];

    if (chosen === 'CIPHER') {
      var nums = word.split('').map(function(c) { return c.charCodeAt(0) - 64; }).join(' - ');
      return {
        q: "FORENSIC CIPHER: Scratched on stone: [ " + nums + " ]. Convert numbers (1=A, 2=B... 26=Z) to find the clue word:",
        a: word,
        hint: "Alphabet number. First letter is " + word[0]
      };
    } else if (chosen === 'CLOCK') {
      var h = [2, 3, 4, 8, 9][Math.floor(Math.random() * 5)];
      var ansH = (h + 6) % 12 || 12;
      var strH = (ansH < 10 ? '0' : '') + ansH + ':00';
      return {
        q: "CLOCK TOWER ALIBI: The clock stopped at " + (h < 10 ? '0' : '') + h + ":00 AM. The killer turned the hour hand 180 degrees backwards. What time (HH:00) did it show?",
        a: strH,
        hint: "Add 6 hours to " + h + ":00"
      };
    } else if (chosen === 'ANAGRAM') {
      var shuffled = word.split('').sort(function() { return 0.5 - Math.random(); }).join('');
      if (shuffled === word) shuffled = word.split('').reverse().join('');
      return {
        q: "SCRAMBLED DYING NOTE: Letters found clutched in hand: [ " + shuffled + " ]. Unscramble:",
        a: word,
        hint: "Word begins with " + word[0]
      };
    } else {
      var primes = [11, 13, 17, 19, 23];
      var p = primes[Math.floor(Math.random() * primes.length)];
      return {
        q: "VAULT CODE: The lock requires the prime number between " + (p - 2) + " and " + (p + 2) + ". Which number is it?",
        a: p.toString(),
        hint: "Divisible only by 1 and itself"
      };
    }
  }

  /* --- TRUE INTERNET MULTIPLAYER VIA MQTT WEBSOCKETS --- */
  var mqttClient = null;
  var roomCode = "TR" + Math.floor(10 + Math.random() * 90);
  var TOPIC_PREFIX = "traitors_game_v2/";
  var currentTopic = "";

  var BOT_NAMES_POOL = ["Vikram (Bot)", "Inspector Roy (Bot)", "Simran (Bot)", "Kabir (Bot)", "Aarya (Bot)"];
  var gameState = {
    myId: 'usr_' + Math.random().toString(36).substr(2, 7),
    myName: "Nick",
    isHost: true,
    players: [],
    round: 1,
    currentClue: null,
    activePuzzle: null,
    logs: []
  };

  function initMqtt(channelCode, onConnected) {
    currentTopic = TOPIC_PREFIX + channelCode;
    var clientId = "traitor_" + Math.random().toString(36).substr(2, 8);
    // Uses HiveMQ free public Secure WebSocket broker
    mqttClient = new Paho.MQTT.Client("broker.hivemq.com", Number(8884), "/mqtt", clientId);

    mqttClient.onConnectionLost = function(resp) {
      console.log("MQTT Lost: ", resp);
    };

    mqttClient.onMessageArrived = function(message) {
      try {
        var msg = JSON.parse(message.payloadString);
        handleIncomingMessage(msg);
      } catch(e) {}
    };

    mqttClient.connect({
      useSSL: true,
      timeout: 10,
      onSuccess: function() {
        mqttClient.subscribe(currentTopic);
        if (onConnected) onConnected();
      },
      onFailure: function(err) {
        console.log("MQTT Connect failed: ", err);
      }
    });
  }

  function sendNetworkMsg(obj) {
    if (mqttClient && mqttClient.isConnected()) {
      var message = new Paho.MQTT.Message(JSON.stringify(obj));
      message.destinationName = currentTopic;
      mqttClient.send(message);
    }
  }

  function handleIncomingMessage(msg) {
    if (gameState.isHost) {
      if (msg.type === 'JOIN_REQUEST') {
        var exists = gameState.players.some(p => p.id === msg.id);
        if (!exists) {
          gameState.players.push({ id: msg.id, name: msg.name, isBot: false, alive: true, role: 'Faithful' });
          updateRosterUI();
          sendNetworkMsg({ type: 'LOBBY_UPDATE', players: gameState.players });
        }
      }
      else if (msg.type === 'ACTION_KILL') {
        var victim = gameState.players.find(p => p.id === msg.targetId);
        if (victim) {
          victim.alive = false;
          gameState.logs.push("Morning arrives. " + victim.name + " was murdered in the dark!");
          launchInvestigation();
        }
      }
      else if (msg.type === 'ACTION_VOTE') {
        var voted = gameState.players.find(p => p.id === msg.targetId);
        if (voted) {
          voted.alive = false;
          gameState.logs.push("The Round Table has spoken: " + voted.name + " is BANISHED!");
          gameState.logs.push(voted.name + " revealed their true identity: " + voted.role.toUpperCase() + "!");
          gameState.round += 1;
          checkGameOverHost();
        }
      }
    } else {
      if (msg.type === 'LOBBY_UPDATE') {
        gameState.players = msg.players;
        document.getElementById('joinStatus').style.color = "#10b981";
        document.getElementById('joinStatus').innerText = "✓ Connected to Chamber! Total Players: " + msg.players.length;
      }
      else if (msg.type === 'GAME_START') {
        gameState.players = msg.players;
        gameState.round = msg.round;
        showRoleReveal();
      }
      else if (msg.type === 'PHASE_NIGHT') {
        gameState.players = msg.players;
        showNight();
      }
      else if (msg.type === 'PHASE_INVESTIGATION') {
        gameState.activePuzzle = msg.puzzle;
        gameState.logs = msg.logs;
        showInvestigation();
      }
      else if (msg.type === 'PHASE_DAY') {
        gameState.players = msg.players;
        gameState.currentClue = msg.clue;
        gameState.logs = msg.logs;
        showDay();
      }
      else if (msg.type === 'GAME_OVER') {
        gameState.players = msg.players;
        showEndScreen(msg.traitorWon);
