<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Traitors: Castle of Shadows</title>
  <style>
    :root {
      --bg: #0d0705;
      --card-bg: rgba(24, 14, 11, 0.96);
      --gold: #d4af37;
      --gold-bright: #ffd700;
      --crimson: #8b0000;
      --border: #442a1d;
      --text: #eae0d5;
      --text-muted: #a39284;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #22100a 0%, var(--bg) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      background: rgba(12, 6, 4, 0.95);
      border-bottom: 2px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .brand { font-size: 1.2rem; color: var(--gold); font-weight: bold; letter-spacing: 1px; }
    .audio-panel { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
    select, button, input {
      background: #23120d;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 4px;
      font-family: inherit;
    }
    button {
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    button.primary {
      background: #8b0000;
      border-color: #d13636;
      color: #fff;
    }
    button.primary:hover { background: #ab0505; }
    button.gold {
      background: #a37a10;
      border-color: var(--gold);
      color: #fff;
    }
    button.gold:hover { background: #b88b14; }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 26px;
      width: 100%;
      max-width: 660px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.85);
      text-align: center;
    }
    h2 { color: var(--gold); margin-bottom: 12px; font-size: 1.5rem; }
    p { color: var(--text-muted); line-height: 1.5; margin-bottom: 16px; font-size: 0.95rem; }
    .room-code-tag {
      background: #140805;
      padding: 6px 14px;
      border: 1px dashed var(--gold);
      color: var(--gold-bright);
      font-size: 1.25rem;
      letter-spacing: 3px;
      display: inline-block;
      margin: 10px 0;
      border-radius: 4px;
      font-weight: bold;
    }
    .roster { display: flex; flex-direction: column; gap: 8px; margin: 15px 0; }
    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(0,0,0,0.45);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge-traitor { background: var(--crimson); color: #fff; }
    .badge-faithful { background: #065f46; color: #a7f3d0; }
    .clue-box {
      background: #160a07;
      border: 1px dashed #78350f;
      padding: 14px;
      border-radius: 6px;
      text-align: left;
      margin: 15px 0;
      color: #fed7aa;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .clue-box strong { color: var(--gold); }
    .log-box {
      height: 120px;
      overflow-y: auto;
      background: #000;
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 4px;
      text-align: left;
      font-size: 0.85rem;
      margin: 12px 0;
      font-family: monospace;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">⚔️ THE TRAITORS: CASTLE OF SHADOWS</div>
  <div class="audio-panel">
    <span>🎵 Bollywood Suspense:</span>
    <select id="bgmSelect">
      <option value="0">1. Talaash (Deep Bass Suspense)</option>
      <option value="1">2. Chase Thriller (Fast)</option>
      <option value="2">3. Raat Ka Sannata (Eerie Sitar)</option>
    </select>
    <button id="audioBtn" class="gold">▶ Play Music</button>
  </div>
</header>

<main>
  <div id="gamePanel" class="panel">
    <h2>ENTER THE CONCLAVE</h2>
    <p>Trust no one. Unmask the Traitor before darkness claims the Faithful.</p>
    
    <div style="margin-bottom: 16px;">
      <label style="display:block;margin-bottom:6px;font-size:0.85rem;color:var(--gold);">YOUR DETECTIVE NAME</label>
      <input type="text" id="nameInput" value="Nick" style="width:100%;max-width:280px;text-align:center;">
    </div>

    <div>
      <p style="font-size:0.85rem;">Room Code:</p>
      <div id="roomCodeDisplay" class="room-code-tag">TR84</div>
      <div class="roster">
        <div class="player-row"><span>You (Host)</span><span class="badge badge-faithful">Ready</span></div>
      </div>
      <p style="font-size:0.8rem;color:#f59e0b;margin-top:10px;">*Solo or missing friends? The button below auto-fills the remaining 4 slots with AI bots.</p>
      <button id="startBtn" class="primary" style="padding:12px 24px;font-size:1rem;margin-top:10px;">
        START GAME (AUTO-FILL 4 BOTS)
      </button>
    </div>
  </div>
</main>

<script>

  var bgmSelect = document.getElementById('bgmSelect');

  audioBtn.addEventListener('click', function() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      isPlaying = !isPlaying;
      audioBtn.innerText = isPlaying ? "⏸ Pause" : "▶ Play Music";

      if (isPlaying) {
        startSoundLoop();
      } else {
        stopSoundLoop();
      }
    } catch(e) {
      console.log("Audio not supported or blocked: ", e);
    }
  });

  function startSoundLoop() {
    stopSoundLoop();
    var track = parseInt(bgmSelect.value, 10);

      if (!audioCtx || !isPlaying) return;
      playTrackNote(track);
    }, interval);
  }

    if (bgmInterval) {
      clearInterval(bgmInterval);
      bgmInterval = null;
    }
  }

    if (isPlaying) startSoundLoop();
  });
