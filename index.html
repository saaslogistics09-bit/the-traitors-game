<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Traitors: Castle of Shadows</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0706;
      --card-bg: rgba(23, 14, 12, 0.95);
      --gold: #d4af37;
      --crimson: #8b0000;
      --crimson-glow: #e62020;
      --border: #442a1d;
      --text: #eae0d5;
      --text-muted: #9e8e82;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1b0f0b 0%, var(--bg) 100%);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 24px;
      background: rgba(10, 5, 4, 0.95);
      border-bottom: 2px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .brand { font-family: 'Cinzel', serif; font-size: 1.2rem; color: var(--gold); font-weight: 800; }
    .audio-panel { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
    select, button, input {
      background: #23120d;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 4px;
      font-family: inherit;
    }
    button {
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button.primary {
      background: linear-gradient(135deg, #a31d1d, #630e0e);
      border-color: #d13636;
      color: #fff;
    }
    button.primary:hover { background: #b01e1e; }
    button.gold {
      background: linear-gradient(135deg, #b8860b, #725204);
      border-color: var(--gold);
      color: #fff;
    }
    button.gold:hover { background: #c59b27; }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 30px;
      width: 100%;
      max-width: 650px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      text-align: center;
    }
    h2 { font-family: 'Cinzel', serif; color: var(--gold); margin-bottom: 12px; font-size: 1.6rem; }
    p { color: var(--text-muted); line-height: 1.5; margin-bottom: 18px; }
    .roster { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(0,0,0,0.45);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .badge {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge-traitor { background: var(--crimson); color: #fff; border: 1px solid #ff4444; }
    .badge-faithful { background: #065f46; color: #a7f3d0; border: 1px solid #10b981; }
    .log-box {
      height: 140px;
      overflow-y: auto;
      background: #000;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 4px;
      text-align: left;
      font-size: 0.85rem;
      margin: 15px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">🏰 THE TRAITORS: CASTLE OF SHADOWS</div>
  <div class="audio-panel">
    <span>🎵 Score:</span>
    <select id="bgmSelect" onchange="changeTrack()">
      <option value="0">1. Raat Ka Sannata (Drone)</option>
      <option value="1">2. Talaash (Suspense Tabla)</option>
      <option value="2">3. Dhokha (Dramatic Chase)</option>
      <option value="3">4. Round Table Climax</option>
    </select>
    <button onclick="toggleAudio()" id="audioBtn">▶ Play Music</button>
  </div>
</header>

<main id="app"></main>

<script>
  let audioCtx = null;
  let isPlaying = false;
  let bgmInterval = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function toggleAudio() {
    initAudio();
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    isPlaying = !isPlaying;
    document.getElementById('audioBtn').innerText = isPlaying ? "⏸ Pause" : "▶ Play Music";
    if (isPlaying) {
      startMusic();
    } else {
      stopMusic();
    }
  }

  function startMusic() {
    stopMusic();
    const track = parseInt(document.getElementById('bgmSelect').value, 10);
    const speed = (track === 2) ? 260 : 650;
    bgmInterval = setInterval(function() {
      if (!audioCtx || !isPlaying) return;
      playSynthNote(track);
    }, speed);
  }

  function stopMusic() {
    if (bgmInterval) {
      clearInterval(bgmInterval);
      bgmInterval = null;
    }
  }

  function changeTrack() {
    if (isPlaying) {
      startMusic();
    }
  }

  function playSynthNote(track) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    const baseFreqs = [55, 65.4, 73.4, 82.4];
    const freq = baseFreqs[Math.floor(Math.random() * baseFreqs.length)];

    if (track === 0) {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.6);
      osc.start(now);
      osc.stop(now + 1.6);
    } else if (track === 1) {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(45, now + 0.15);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    } else {
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq * 2, now);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    }
  }

  const BOT_NAMES = ["Vikram (Bot)", "Inspector Roy (Bot)", "Simran (Bot)", "Kabir (Bot)"];
  const BOT_DIALOGUES = [
    "Mujhe lagta hai ye game shanti se nahi jeeti jayegi...",
    "Kiski aakhon mein sach nahi dikh raha, socho!",
    "Banishment mein galat faisla hum sabko le doobega.",
    "Main bas itna kahunga... dhyan se vote karo!"
  ];

  let state = {
    playerName: "Nick",
    players: [],
    phase: 'LOBBY',
    round: 1,
    logs: [],
    winner: null,
    endMessage: ""
  };

  function addLog(msg) {
    state.logs.push(msg);
    const box = document.getElementById('logBox');
    if (box) {
      box.innerHTML = state.logs.map(function(l) { return '<div>• ' + l + '</div>'; }).join('');
      box.scrollTop = box.scrollHeight;
    }
  }

  function render() {
    const app = document.getElementById('app');

    if (state.phase === 'LOBBY') {
      app.innerHTML = `
        <div class="panel">
          <h2>ENTER THE CONCLAVE</h2>
          <p>Trust no one. Unmask the Traitor before darkness claims the Faithful.</p>
          <div style="margin-bottom: 20px;">
            <label style="display:block;margin-bottom:8px;font-size:0.85rem;color:var(--gold);">PLAYER IDENTITY</label>
            <input type="text" id="nameInput" value="${state.playerName}" style="width:100%;max-width:300px;text-align:center;">
          </div>
          <button class="primary" onclick="startGathering()" style="padding:12px 28px;font-size:1.05rem;">
            CREATE CASTLE ROOM (AUTO-FILL 4 BOTS)
          </button>
        </div>
      `;
    } else if (state.phase === 'ROLE_REVEAL') {
      const me = state.players.find(function(p) { return !p.isBot; });
      const roleClass = (me.role === 'Traitor') ? 'badge-traitor' : 'badge-faithful';
      const roleDesc = (me.role === 'Traitor') 
        ? 'You walk in shadows. Eliminate the Faithful without getting caught.' 
        : 'Protect the Castle. Unmask and banish the Traitor at the Round Table.';

      app.innerHTML = `
        <div class="panel">
          <h2>YOUR SECRET ROLE</h2>
          <div style="margin:25px 0;">
            <span class="badge ${roleClass}" style="font-size:1.3rem;padding:8px 22px;">
              ${me.role.toUpperCase()}
            </span>
          </div>
          <p>${roleDesc}</p>
          <button class="gold" onclick="nextPhase('NIGHT')" style="padding:10px 24px;">Enter Night 1 🌙</button>
        </div>
      `;
    } else if (state.phase === 'NIGHT') {
      const me = state.players.find(function(p) { return !p.isBot; });
      const targets = state.players.filter(function(p) { return p.alive && p.id !== me.id; });

      if (me.role === 'Traitor' && me.alive) {
        let targetsHtml = targets.map(function(p) {
          return `
            <div class="player-row">
              <span>${p.name}</span>
              <button class="primary" onclick="executeNightKill('${p.id}')">Murder 🗡️</button>
            </div>
          `;
        }).join('');

        app.innerHTML = `
          <div class="panel">
            <h2 style="color:var(--crimson-glow);">THE NIGHT CONCLAVE</h2>
            <p style="color:#f87171;">Select a Faithful to assassinate tonight:</p>
            <div class="roster">${targetsHtml}</div>
          </div>
        `;
      } else {
        app.innerHTML = `
          <div class="panel">
            <h2 style="color:var(--crimson-glow);">THE NIGHT CONCLAVE</h2>
            <p>The castle sleeps. Whispers echo through the corridors.</p>
            <p>You lock your doors and pray to survive the night.</p>
            <button class="gold" onclick="botNightAction()" style="margin-top:15px;padding:10px 24px;">Wait For Dawn ☀️</button>
          </div>
        `;
      }
    } else if (state.phase === 'DAY') {
      const livingPlayers = state.players.filter(function(p) { return p.alive; });
      const playersHtml = livingPlayers.map(function(p) {
        return `
          <div class="player-row">
            <strong>${p.name}</strong>
            <button class="primary" onclick="castVote('${p.id}')">Vote Banish</button>
          </div>
        `;
      }).join('');

      app.innerHTML = `
        <div class="panel">
          <h2>THE ROUND TABLE</h2>
          <p>Round ${state.round} Discussion & Banishment Vote</p>
          <div class="log-box" id="logBox">
            ${state.logs.map(function(l) { return '<div>• ' + l + '</div>'; }).join('')}
          </div>
          <div class="roster">${playersHtml}</div>
        </div>
      `;
    } else if (state.phase === 'GAME_OVER') {
      const title = (state.winner === 'Traitor') ? '🩸 THE TRAITOR PREVAILS' : '🏆 THE FAITHFUL TRIUMPH';
      const rosterHtml = state.players.map(function(p) {
        const badge = (p.role === 'Traitor') ? 'badge-traitor' : 'badge-faithful';
        return `
          <div class="player-row">
            <span>${p.name} ${!p.alive ? '<span style="color:#ef4444;">[ELIMINATED]</span>' : ''}</span>
            <span class="badge ${badge}">${p.role}</span>
          </div>
        `;
      }).join('');

      app.innerHTML = `
        <div class="panel">
          <h2>${title}</h2>
          <p>${state.endMessage}</p>
          <div class="roster">${rosterHtml}</div>
          <button class="gold" onclick="resetGame()" style="margin-top:20px;padding:10px 24px;">Play Again</button>
        </div>
      `;
    }
  }

  function startGathering() {
    const input = document.getElementById('nameInput');
    state.playerName = (input && input.value.trim()) ? input.value.trim() : "Player";

    state.players = [
      { id: 'p1', name: state.playerName, isBot: false, alive: true, role: 'Faithful' }
    ];

    BOT_NAMES.forEach(function(name, i) {
      state.players.push({
        id: 'bot_' + i,
        name: name,
        isBot: true,
        alive: true,
        role: 'Faithful'
      });
    });

    const traitorIdx = Math.floor(Math.random() * state.players.length);
    state.players[traitorIdx].role = 'Traitor';

    state.phase = 'ROLE_REVEAL';
    render();
  }

  function nextPhase(phase) {
    state.phase = phase;
    render();
  }

  function executeNightKill(targetId) {
    const victim = state.players.find(function(p) { return p.id === targetId; });
    victim.alive = false;
    addLog(`Morning arrives. ${victim.name} was murdered in the dead of night!`);
    checkWinCondition('DAY');
  }

  function botNightAction() {
    const traitor = state.players.find(function(p) { return p.role === 'Traitor' && p.alive; });
    if (traitor && traitor.isBot) {
      const livingFaithful = state.players.filter(function(p) { return p.alive && p.role === 'Faithful'; });
      if (livingFaithful.length > 0) {
        const victim = livingFaithful[Math.floor(Math.random() * livingFaithful.length)];
        victim.alive = false;
        addLog(`Morning arrives. ${victim.name} was murdered in the dark!`);
      }
    } else {
      addLog("The sun rises. Miraculously, no one was murdered tonight.");
    }

    const livingBots = state.players.filter(function(p) { return p.isBot && p.alive; });
    if (livingBots.length > 0) {
      const randomBot = livingBots[Math.floor(Math.random() * livingBots.length)];
      const line = BOT_DIALOGUES[Math.floor(Math.random() * BOT_DIALOGUES.length)];
      addLog(`${randomBot.name}: "${line}"`);
    }

    checkWinCondition('DAY');
  }

  function castVote(targetId) {
    const voted = state.players.find(function(p) { return p.id === targetId; });
    voted.alive = false;
    addLog(`The Round Table has spoken: ${voted.name} has been banished!`);
    addLog(`${voted.name} reveals their true identity: ${voted.role.toUpperCase()}!`);
    state.round += 1;
    checkWinCondition('NIGHT');
  }

  function checkWinCondition(next) {
    const livingTraitors = state.players.filter(function(p) { return p.alive && p.role === 'Traitor'; }).length;
    const livingFaithful = state.players.filter(function(p) { return p.alive && p.role === 'Faithful'; }).length;

    if (livingTraitors === 0) {
      state.phase = 'GAME_OVER';
      state.winner = 'Faithful';
      state.endMessage = "All Traitors have been unmasked and banished! The Faithful survive!";
    } else if (livingTraitors >= livingFaithful) {
      state.phase = 'GAME_OVER';
      state.winner = 'Traitor';
      state.endMessage = "The Traitors equal or outnumber the Faithful. The Castle has fallen!";
    } else {
      state.phase = next;
    }
    render();
  }

  function resetGame() {
    state.phase = 'LOBBY';
    state.round = 1;
    state.logs = [];
    state.winner = null;
    state.endMessage = "";
    render();
  }

  render();
</script>
</body>
</html>
